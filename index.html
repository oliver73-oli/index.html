
<!DOCTYPE html>
<html lang="es">
<head>

  <title>Gratificación Sugerida</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    img.logo {
      margin-top: 40px;
      width: 300px;
      max-width: 90%;
      height: auto;
    }

    h1 {
      margin-top: 30px;
      margin-bottom: 50px;
      font-size: 3em;
      color: #333;
    }

    .button-container {
      display: flex;
      gap: 30px;
      margin-bottom: 60px;
    }

    .tip-button {
      padding: 25px 50px;
      font-size: 2em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease;
      color: white;
    }

    .tip-button:hover {
      transform: scale(1.05);
    }

    .btn-20 {
      background-color: #4CAF50;
    }

    .btn-23 {
      background-color: #2196F3;
    }

    .btn-25 {
      background-color: gold;
      color: black;
      font-weight: bold;
    }
