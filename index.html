<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Página de Propinas</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    flex-direction: column;
  }
  .buttons {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
  }
  button {
    padding: 15px 25px;
    font-size: 1.2rem;
    cursor: pointer;
    border: none;
    border-radius: 5px;
  }
  #thanks {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }
</style>
</head>
<body>
<div class="buttons">
  <button id="btn20">20%</button>
  <button id="btn23">23%</button>
  <button id="btn25">Propina sugerida 25%</button>
</div>
<div id="thanks">Gracias</div>
<script>
  document.getElementById('btn20').addEventListener('click', function() {
    document.getElementById('thanks').style.display = 'flex';
  });
</script>
</body>
</html>
